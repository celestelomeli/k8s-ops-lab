# ArgoCD Application for the inventory app (pull-based GitOps)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/celestelomeli/k8s-ops-lab.git
    targetRevision: issue11
    path: eks/manifests
    kustomize:
      # git (ArgoCD diffs on it) and only the account-ID registry is added here.
      # __ACCOUNT_ID__ is a distinctive placeholder so the apply-time sed can't
      # accidentally match anything else. Substitute it locally, never commit the real value.
      images:
        - inventory-api=__ACCOUNT_ID__.dkr.ecr.us-east-1.amazonaws.com/inventory-api
        - notifier=__ACCOUNT_ID__.dkr.ecr.us-east-1.amazonaws.com/notifier

  destination:
    server: https://kubernetes.default.svc
    namespace: inventory

  syncPolicy:
    automated:
      prune: true      # delete resources removed from git
      selfHeal: true   # revert manual drift back to git state
    syncOptions:
      - CreateNamespace=true
    retry:
      # external-secret/secret-store need the ESO CRDs 
      # retry lets the first sync succeed once those CRDs are present.
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
