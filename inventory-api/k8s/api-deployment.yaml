# api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: inventory
spec:
  replicas: 1                    # how many pods to keep running
  selector:
    matchLabels:
      app: inventory-api         # pods this Deployment manages
  template:                      # pod blueprint
    metadata:
      labels:
        app: inventory-api       # must match selector above
    spec:
      containers:
        - name: api
          image: inventory-api:v4
          imagePullPolicy: IfNotPresent   # use local image, don't pull from registry
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5    # wait for app to start before first check
            periodSeconds: 10         # check every 10 seconds
            failureThreshold: 3       # restart after 3 consecutive failures
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5          # check readiness more frequently than liveness
            failureThreshold: 3       # remove from service rotation after 3 failures
          envFrom:
            - configMapRef:
                name: inventory-config    # injects DB_HOST, DB_PORT, DB_NAME, DB_USER
            - secretRef:
                name: inventory-secret    # injects DB_PASSWORD
