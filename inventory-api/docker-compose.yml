services:

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres        # service name is the hostname 
      - DB_PORT=5432
      - DB_USER=${DB_USER}      
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - postgres                # ensures postgres starts first

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data  # volume persists data across container restarts
      - ./init:/docker-entrypoint-initdb.d # runs SQL scripts on first startup
    ports:
      - "5432:5432"           

volumes:
  postgres-data:               