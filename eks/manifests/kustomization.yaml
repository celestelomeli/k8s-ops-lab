apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass.yaml
  - configmap.yaml
  - secret-store.yaml
  - external-secret.yaml
  - postgres-pvc.yaml
  - postgres-initdb-configmap.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - notifier-deployment.yaml
  - notifier-service.yaml
  - hpa.yaml

# Intentionally NOT managed by ArgoCD (installed at cluster bootstrap):
#   - metrics-server.yaml  (cluster add-on; HPA depends on it but it is infra,
#                            not app state)
