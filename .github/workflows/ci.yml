name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - "inventory-api/**"
      - "notifier/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "inventory-api/**"
      - "notifier/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  id-token: write # AWS OIDC handshake
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - inventory-api/backend
          - notifier
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod

      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        run: go test -v ./...

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine 
        env:
          # throwaway credentials for a test db
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: inventory-api/backend/go.mod

      - name: Run integration tests
        working-directory: inventory-api/backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: inventory
          DB_PASSWORD: test_password
          DB_NAME: inventory
        run: go test -tags=integration -v ./...

  build-push:
    needs: [test, integration-test] # only build/push images if all tests pass
    if: github.event_name == 'push' # don't run on PRs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: inventory-api
            context: inventory-api/backend
          - name: notifier
            context: notifier
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.name }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ matrix.name }}:latest
